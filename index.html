<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Préstamos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./images/loan.png" type="image/png">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="historial"><a href="./historial.html"><span title="Ver Historial">📋</span></a></div>
    <h1 class="center separador">Calculadora de Préstamos 💰</h1>
    <div class="center div-cotizador">
        <h2 class="center separador">Completa los datos solicitados</h2>
        
        <label for="monto">Ingresa el monto del préstamo:</label>
        <input type="number" id="monto" value="10000" min="1000" max="1000000" required>
        
        <label for="plazo">Selecciona el plazo (en meses):</label>
        <select id="plazo">
            <option selected disabled>...</option>
            <!-- Aquí se cargarán dinámicamente las opciones de plazo usando JavaScript -->
        </select>
        
        <label for="tasa">Selecciona la tasa de interés anual:</label>
        <select id="tasa">
            <option selected disabled>...</option>
            <!-- Aquí se cargarán dinámicamente las opciones de tasa de interés usando JavaScript -->
        </select>
        
        <div class="center separador">
            <button class="button button-outline">Calcular</button>
            <!-- Este botón calculará la cuota mensual y redirigirá a la página de historial usando JavaScript -->
        </div>
        
        <div class="center separador">
            <p class="importe">Cuota mensual estimada: $ <span id="cuotaMensual">0.00</span></p>
            <!-- Aquí se mostrará la cuota mensual estimada calculada dinámicamente usando JavaScript -->
        </div>
    </div>
    <!-- Enlace al archivo de JavaScript principal -->
    <script defer src="./js/app.js"></script>
</body>
</html>
