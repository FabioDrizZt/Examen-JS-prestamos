<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Préstamos - Examen de JavaScript</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="header-container">
        <h1>💰 Calculadora de Préstamos</h1>
        <p class="subtitle">Simulador financiero de cuotas, tasas y líneas de crédito</p>
      </div>
    </header>

    <main class="main-container">
      <section class="card div-cotizador">
        <h2>Completá los datos solicitados</h2>
        <form id="formPrestamo">
          <div class="form-group">
            <label for="monto">Ingresá el monto solicitado ($):</label>
            <input
              type="number"
              id="monto"
              value="100000"
              min="1000"
              max="10000000"
              step="1000"
              required
            />
          </div>

          <div class="form-group">
            <label for="plazo">Seleccioná el plazo en cuotas:</label>
            <select id="plazo" required>
              <option value="" selected disabled>Cargando plazos...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="tasa">Seleccioná la línea de crédito (TNA):</label>
            <select id="tasa" required>
              <option value="" selected disabled>Cargando tasas...</option>
            </select>
          </div>

          <div class="precio-container">
            <p class="precio-label">
              Cuota mensual estimada:
              <span class="precio-valor">$ <span id="cuotaMensual">0.00</span></span>
            </p>
            <p class="precio-label">
              Total estimado a devolver:
              <span class="precio-total">$ <span id="totalPagar">0.00</span></span>
            </p>
          </div>

          <button type="submit" id="btnCalcular" class="btn btn-primary">
            Calcular y Guardar Simulación
          </button>
        </form>
      </section>

      <section class="card historial-section">
        <div class="historial-header">
          <h2>📋 Historial de Simulaciones</h2>
          <button type="button" id="btnLimpiarHistorial" class="btn btn-outline">
            Limpiar Historial
          </button>
        </div>
        <ul id="historialLista" class="historial-lista">
          <!-- Historial de simulaciones -->
        </ul>
      </section>
    </main>

    <footer class="main-footer">
      <p>Programación II - Examen Práctico de Frontend con JavaScript</p>
    </footer>

    <script type="module" src="js/script.js"></script>
  </body>
</html>
